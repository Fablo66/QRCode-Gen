<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>QR Code Generator</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f4f6f9;
  padding: 50px;
}

input {
  padding: 10px;
  width: 300px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  padding: 10px 20px;
  border: none;
  background: #1e5f8c;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #4aa3df;
}

#qrcode {
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>QR Code Generator</h1>

<input type="text" id="text" placeholder="Link eingeben...">
<br><br>
<button onclick="generateQR()">Generieren</button>

<div id="qrcode"></div>

<!-- QR Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
function generateQR() {
  let text = document.getElementById("text").value;
  let qrcodeDiv = document.getElementById("qrcode");

  qrcodeDiv.innerHTML = ""; // alten löschen

  new QRCode(qrcodeDiv, {
    text: text,
    width: 200,
    height: 200
  });
}
</script>

</body>
</html>
