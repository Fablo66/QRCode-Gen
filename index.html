<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>QR Code Generator</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f4f6f9;
  padding: 50px;
}

input {
  padding: 10px;
  width: 300px;
  border-radius: 8px;
}

button {
  padding: 10px 20px;
  margin: 5px;
  border: none;
  background: #1e5f8c;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

canvas {
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>QR Code Generator</h1>

<input type="text" id="text" placeholder="Link eingeben...">
<br><br>

<button onclick="generateQR()">Generieren</button>
<button onclick="downloadQR()">Download</button>
<button onclick="copyQR()">Kopieren</button>

<br>
<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>

<script>
let canvas = document.getElementById("canvas");

function generateQR() {
  let text = document.getElementById("text").value;

  QRCode.toCanvas(canvas, text, function (error) {
    if (error) console.error(error);
  });
}

function downloadQR() {
  let link = document.createElement('a');
  link.download = 'qrcode.png';
  link.href = canvas.toDataURL();
  link.click();
}

function copyQR() {
  canvas.toBlob(function(blob) {
    const item = new ClipboardItem({ "image/png": blob });
    navigator.clipboard.write([item]);
    alert("QR-Code kopiert!");
  });
}
</script>

</body>
</html>
